:root{--emerald:#176B50;--emerald-dark:#0F5540;--lime:#C5E86C;--bud:#5FA80C;--ivory:#F8F8F0;--sage:#E5EDE2;--forest:#244437;--white:#fff;--line:#D5E0D1;--muted:#4D6558;--danger:#A32D2D;--danger-bg:#FBEAEA;--head:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);font-size:1rem;line-height:1.6;color:var(--forest);background:var(--ivory);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}a{color:var(--emerald)}
h1,h2,h3,h4{font-family:var(--head);line-height:1.15;letter-spacing:-.01em}
:focus-visible{outline:3px solid var(--emerald);outline-offset:2px;border-radius:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:12px;font-family:var(--head);font-weight:700;font-size:.92rem;text-decoration:none;border:2px solid transparent;cursor:pointer;transition:background-color .18s,color .18s,border-color .18s;background:none;color:var(--forest)}
.btn-primary{background:var(--emerald);color:#fff}.btn-primary:hover{background:var(--emerald-dark)}
.btn-lime{background:var(--lime);color:var(--forest)}.btn-lime:hover{background:#d4f088}
.btn-ghost{border-color:var(--emerald);color:var(--emerald)}.btn-ghost:hover{background:var(--emerald);color:#fff}
.btn-quiet{border-color:var(--line);background:#fff}.btn-quiet:hover{border-color:var(--emerald)}
.btn-sm{min-height:38px;padding:0 14px;font-size:.84rem;border-radius:10px}
.btn-block{width:100%}.btn[disabled]{opacity:.55;cursor:not-allowed}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none}
.brand img{height:44px;width:auto}
.brand .word{font-family:var(--head);font-weight:800;font-size:1.45rem;letter-spacing:-.03em;color:var(--forest);line-height:1}.brand .word b{color:var(--bud)}

/* Auth */
.auth{min-height:100vh;display:grid;grid-template-columns:.85fr 1.15fr}
.auth-side{background:var(--emerald);color:#fff;padding:44px 48px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.auth-side .brandcard{background:var(--ivory);border-radius:16px;padding:10px 16px;align-self:flex-start}
.auth-side h2{font-size:clamp(1.5rem,2.6vw,2.1rem);color:#fff;max-width:14em}
.auth-side ul{list-style:none;margin-top:22px;display:grid;gap:12px}
.auth-side li{display:flex;gap:12px;align-items:flex-start;color:rgba(255,255,255,.92)}
.auth-side li::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--lime);margin-top:9px}
.auth-side small{color:rgba(255,255,255,.75)}
.auth-main{padding:44px 24px 64px;display:flex;justify-content:center}
.auth-card{width:100%;max-width:600px}
.auth-card h1{font-size:clamp(1.6rem,3vw,2.1rem);font-weight:800}
.auth-card .sub{color:var(--muted);margin:8px 0 26px}
.auth-card .alt{margin-top:22px;color:var(--muted);font-size:.96rem}
.switch{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--sage);padding:5px;border-radius:14px;margin-bottom:26px}
.switch a{text-align:center;padding:11px;border-radius:10px;text-decoration:none;font-family:var(--head);font-weight:700;font-size:.92rem;color:var(--forest)}
.switch a.on{background:#fff;color:var(--emerald);box-shadow:0 1px 0 var(--line)}
.back{display:inline-block;margin-bottom:22px;font-size:.92rem;font-weight:600;text-decoration:none}

/* Forms */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.full{grid-column:1/-1}
.field{margin-bottom:16px}.grid2 .field{margin-bottom:0}
.field label,.lbl{display:block;font-family:var(--head);font-weight:700;font-size:.86rem;margin-bottom:6px}
.field input[type=text],.field input[type=email],.field input[type=password],.field input[type=url],.field input[type=tel],.field input[type=number],.field select,.field textarea{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font:inherit;color:var(--forest);background:#fff}
.field textarea{min-height:110px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--emerald);outline:3px solid rgba(23,107,80,.18);outline-offset:0}
.field [aria-invalid=true]{border-color:var(--danger)}
.hint{font-size:.82rem;color:var(--muted);margin-top:5px}
.err{font-size:.84rem;color:var(--danger);margin-top:5px;min-height:0}
.err:empty{display:none}
.pwwrap{position:relative}.pwwrap input{padding-right:78px!important}
.pwwrap button{position:absolute;right:6px;top:6px;height:36px;padding:0 12px;border:none;background:var(--sage);border-radius:9px;font-weight:600;font-size:.82rem;color:var(--emerald);cursor:pointer}
.meter{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.meter i{height:5px;border-radius:3px;background:var(--line)}
.meter[data-s="1"] i:nth-child(1){background:#C0453A}
.meter[data-s="2"] i:nth-child(-n+2){background:#D49A2A}
.meter[data-s="3"] i:nth-child(-n+3){background:#7BB33A}
.meter[data-s="4"] i{background:var(--emerald)}
.rules{list-style:none;display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:.8rem;color:var(--muted)}
.rules li::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted);margin-right:6px}
.rules li.ok{color:var(--emerald)}.rules li.ok::before{background:var(--emerald);border-color:var(--emerald)}
.checks{display:grid;gap:8px}
.chk{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font-size:.95rem}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--emerald);flex:none}
.chk:has(input:checked){border-color:var(--emerald);background:#F2F8EE}
.chkgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.alert{border-radius:14px;padding:14px 16px;margin-bottom:20px;font-size:.95rem}
.alert.ok{background:#EAF4DC;border:1px solid #C5E86C}.alert.bad{background:var(--danger-bg);border:1px solid #E7B9B9;color:#6E1E1E}.alert.info{background:var(--sage);border:1px solid var(--line)}
.devbox{border:2px dashed var(--emerald);border-radius:16px;padding:18px;margin-top:22px;background:#fff}
.devbox b{font-family:var(--head)}.devbox p{font-size:.9rem;color:var(--muted);margin:6px 0 12px}

/* App shell */
.app{display:grid;grid-template-columns:268px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow:auto}
.side nav{display:grid;gap:4px}
.side nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;text-decoration:none;font-family:var(--head);font-weight:600;font-size:.94rem;color:var(--forest)}
.side nav a:hover{background:var(--sage)}
.side nav a.on{background:var(--emerald);color:#fff}
.side nav svg,.tabbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pill{margin-left:auto;background:var(--lime);color:var(--forest);font-size:.72rem;font-weight:800;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px}
.side nav a.on .pill{background:var(--lime)}
.usercard{margin-top:auto;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:11px;align-items:center;background:var(--ivory)}
.usercard .nm{font-weight:700;font-size:.9rem;line-height:1.2;font-family:var(--head)}.usercard small{color:var(--muted);font-size:.78rem}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:var(--sage);display:grid;place-items:center;font-family:var(--head);font-weight:800;color:var(--emerald);overflow:hidden;font-size:.95rem}
.av img{width:100%;height:100%;object-fit:cover}.av.lg{width:84px;height:84px;font-size:1.5rem}
.main{min-width:0}
.topbar{display:none}
.content{padding:36px 40px 80px;max-width:1120px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.page-h h1{font-size:clamp(1.55rem,3vw,2.1rem);font-weight:800}.page-h p{color:var(--muted);margin-top:6px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px}
.card h2{font-size:1.1rem;margin-bottom:4px}.card .c-sub{color:var(--muted);font-size:.9rem;margin-bottom:16px}
.card+.card{margin-top:18px}
.cols{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.cols>.card{margin:0}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted);font-size:.93rem;background:var(--ivory)}
.bar{height:12px;border-radius:8px;background:var(--sage);overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;background:var(--emerald);border-radius:8px}
.big{font-family:var(--head);font-weight:800;font-size:2.4rem;line-height:1}
.todo{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.todo a{display:inline-block;font-size:.84rem;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--sage);text-decoration:none;color:var(--forest)}
.todo a:hover{background:var(--lime)}
.list{list-style:none;display:grid;gap:10px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.row .who{display:flex;gap:12px;align-items:center;min-width:0}
.row .who strong{display:block;font-family:var(--head);font-size:.96rem;line-height:1.2}.row .who small{color:var(--muted);font-size:.82rem}
.acts{display:flex;gap:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.78rem;font-weight:600;background:var(--sage);color:var(--emerald);padding:3px 10px;border-radius:8px}
.tag.lime{background:var(--lime);color:var(--forest)}.tag.demo{background:#fff;border:1px dashed var(--muted);color:var(--muted)}
.acts-log li{display:flex;gap:10px;font-size:.92rem;padding:8px 0;border-bottom:1px solid var(--line)}.acts-log li:last-child{border:none}
.acts-log time{margin-left:auto;color:var(--muted);font-size:.8rem;white-space:nowrap}

/* Discover */
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:18px}
.filters .field{margin:0}.filters label{font-size:.78rem}.filters .field input,.filters .field select{min-height:42px;font-size:.92rem;padding:6px 12px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.pcard .top{display:flex;gap:12px;align-items:center}
.pcard h3{font-size:1.02rem}.pcard .u{color:var(--muted);font-size:.84rem}
.pcard .meta{font-size:.88rem;color:var(--muted)}
.pcard .bio{font-size:.9rem;color:var(--forest);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pcard .foot{margin-top:auto}

/* Profile/skills */
.photo-row{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.item{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--ivory)}
.item strong{font-family:var(--head);font-size:.96rem}.item p{font-size:.88rem;color:var(--muted)}
.x{border:none;background:none;color:var(--danger);font-weight:700;font-size:.84rem;cursor:pointer;padding:6px 8px;border-radius:8px}.x:hover{background:var(--danger-bg)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sage);border-radius:999px;padding:5px 6px 5px 12px;font-size:.88rem;font-weight:600}
.chip button{border:none;background:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer;color:var(--emerald);font-weight:800;line-height:1}
.skill{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff;display:grid;gap:12px}
.skill-h{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.skill-h strong{font-family:var(--head);font-size:1.02rem}
.skill select{min-height:40px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;font:inherit;background:#fff}
.skill .opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{display:flex;gap:8px;align-items:center;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:.88rem;cursor:pointer}
.opt input{accent-color:var(--emerald);width:18px;height:18px}.opt:has(input:checked){border-color:var(--emerald);background:#F2F8EE}
.toggle{position:relative;display:inline-block;width:46px;height:26px}
.toggle input{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer;margin:0;z-index:1}
.toggle span{position:absolute;inset:0;background:var(--line);border-radius:20px;transition:background-color .18s}
.toggle span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .18s}
.toggle input:checked+span{background:var(--emerald)}.toggle input:checked+span::after{transform:translateX(20px)}
.toggle input:focus-visible+span{outline:3px solid var(--emerald);outline-offset:2px}
.ptable{width:100%;border-collapse:collapse}
.ptable th{font-family:var(--head);font-size:.8rem;text-align:center;padding:6px 8px;color:var(--muted)}.ptable th:first-child{text-align:left}
.ptable td{padding:13px 8px;border-top:1px solid var(--line);text-align:center}.ptable td:first-child{text-align:left}
.ptable td small{display:block;color:var(--muted);font-size:.8rem}
.notif{display:flex;gap:14px;padding:16px 4px;border-bottom:1px solid var(--line);align-items:flex-start}
.notif:last-child{border:none}
.notif .ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--sage);display:grid;place-items:center}
.notif .ic svg{width:20px;height:20px;stroke:var(--emerald);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.notif.unread .ic{background:var(--lime)}
.notif .t{font-size:.96rem}.notif .t small{display:block;color:var(--muted);margin-top:2px}
.notif.unread .t{font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--emerald);flex:none;margin-top:7px;margin-left:auto}

.cols3>.card{margin:0}
.field label.chk{display:flex;font-family:var(--body);font-weight:400;font-size:.95rem;margin:0}
.auth-side{position:sticky;top:0;height:100vh}
.list .row{flex-wrap:nowrap}
.row .who{flex:1 1 auto;min-width:0}
.row .who>div{min-width:0}
.row .who small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .acts{flex-wrap:wrap;justify-content:flex-end;flex:none}
.list .row>.btn,.list .row>.tag{flex:none}
@media (max-width:820px){.auth-side{position:static;height:auto}}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* Mobile tab bar */
.tabbar{display:none}
.menu{display:none;position:fixed;inset:0;z-index:70;background:rgba(36,68,55,.55)}
.menu.open{display:block}
.menu .sheet{position:absolute;right:0;top:0;bottom:0;width:min(86%,330px);background:var(--ivory);padding:20px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.menu .sheet a,.menu .sheet button.l{display:flex;align-items:center;gap:12px;padding:14px 10px;border-radius:12px;text-decoration:none;font-family:var(--head);font-weight:700;font-size:1rem;color:var(--forest);border:none;background:none;text-align:left;cursor:pointer;width:100%}
.menu .sheet a.on{background:var(--sage)}
.menu svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--forest);color:#fff;padding:12px 20px;border-radius:12px;font-size:.92rem;z-index:90;max-width:90%;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.proto{background:var(--lime);color:var(--forest);font-size:.8rem;font-weight:600;text-align:center;padding:6px 12px}

@media (max-width:1040px){
  .filters{grid-template-columns:repeat(2,1fr)}.pgrid{grid-template-columns:repeat(2,1fr)}.cols3{grid-template-columns:1fr}
}
@media (max-width:820px){
  .auth{grid-template-columns:1fr}
  .auth-side{padding:22px 20px;gap:0}.auth-side h2,.auth-side ul,.auth-side small{display:none}
  .auth-main{padding:28px 18px 56px}
  .app{grid-template-columns:1fr}.side{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
  .topbar .brand img{height:38px}.topbar .brand .word{font-size:1.25rem}
  .topbar .btn{min-width:44px;padding:0 12px}
  .content{padding:22px 16px 110px}
  .cols{grid-template-columns:1fr}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:50;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;text-decoration:none;font-size:.7rem;font-weight:700;font-family:var(--head);color:var(--muted);border-radius:12px;position:relative}
  .tabbar a.on{color:var(--emerald);background:var(--sage)}
  .tabbar .pill{position:absolute;top:2px;right:18%;margin:0;min-width:18px;height:18px;font-size:.66rem}
  .toast{bottom:96px}
}
@media (max-width:620px){
  .grid2,.chkgrid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.filters .field{grid-column:1/-1!important}.pgrid{grid-template-columns:1fr}
  .card{padding:18px;border-radius:18px}
  .page-h .btn{width:100%}
  .ptable th,.ptable td{padding-left:4px;padding-right:4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===================== Sections 6, 7, 8, 9 Styles ===================== */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,85,64,0.48);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;animation:tbFadeIn .18s ease-out}
.modal-dialog{background:var(--white);border-radius:18px;border:1px solid var(--line);max-width:760px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 24px 50px rgba(24,68,55,0.22);padding:28px;position:relative}
.modal-close{position:absolute;top:18px;right:18px;background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--muted);width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;line-height:1}
.modal-close:hover{background:var(--sage);color:var(--forest)}
@keyframes tbFadeIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}

.badge{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:999px;letter-spacing:.02em;text-transform:uppercase}
.badge.active{background:#E8F5E9;color:#1B5E20;border:1px solid #A5D6A7}
.badge.forming{background:#FFF9C4;color:#E65100;border:1px solid #FFE082}
.badge.needs-members{background:#FFEBEE;color:#C62828;border:1px solid #EF9A9A}
.badge.role{background:var(--sage);color:var(--forest);border:1px solid var(--line);text-transform:none;font-weight:600}

.rule-tracker{background:var(--sage);padding:18px 22px;border-radius:14px;border:1px solid var(--line);margin-bottom:22px}
.rule-tracker .rule-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-family:var(--head);font-weight:700}
.rule-tracker .meter-bar{height:10px;background:rgba(23,107,80,0.15);border-radius:999px;overflow:hidden;margin:8px 0}
.rule-tracker .meter-bar i{display:block;height:100%;background:var(--emerald);border-radius:999px;transition:width .3s}
.rule-tracker .meter-bar.active i{background:var(--bud)}
.rule-tracker .meter-bar.needs i{background:var(--danger)}

.subnav{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:24px;overflow-x:auto;padding-bottom:2px}
.subnav a,.subnav button{padding:10px 16px;border:none;background:none;font-family:var(--head);font-weight:600;font-size:.9rem;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-4px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border-radius:6px 6px 0 0}
.subnav a:hover,.subnav button:hover{color:var(--forest);background:rgba(229,237,226,0.5)}
.subnav a.on,.subnav button.on{color:var(--emerald);border-bottom-color:var(--emerald);font-weight:800;background:none}

.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:16px}
.proj-card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 2px 6px rgba(0,0,0,0.02)}
.proj-status{font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:999px;text-transform:uppercase}
.proj-status.New{background:#E3F2FD;color:#1565C0}
.proj-status.Planning{background:#FFF3E0;color:#E65100}
.proj-status.InProgress{background:#E8F5E9;color:#2E7D32}
.proj-status.UnderReview{background:#EDE7F6;color:#512DA8}
.proj-status.Completed{background:#E0F2F1;color:#00695C}
.proj-status.Cancelled{background:#FFEBEE;color:#C62828}

.chat-panel{display:flex;flex-direction:column;height:520px;border:1px solid var(--line);border-radius:14px;background:var(--white);overflow:hidden}
.chat-head{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--ivory);display:flex;justify-content:space-between;align-items:center}
.chat-stream{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.chat-msg{display:flex;gap:12px;max-width:82%}
.chat-msg.mine{align-self:flex-end;flex-direction:row-reverse}
.chat-bubble{background:var(--ivory);padding:12px 16px;border-radius:14px;border:1px solid var(--line);font-size:.92rem}
.chat-msg.mine .chat-bubble{background:var(--sage);border-color:#BDD4C7}
.chat-footer{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line);background:var(--white);align-items:center}

.quote-card{border:2px solid var(--emerald);background:#FAFCF9;border-radius:14px;padding:22px;margin-top:16px}
.quote-price{font-size:1.75rem;font-family:var(--head);font-weight:800;color:var(--emerald)}
.milestone-table{width:100%;border-collapse:collapse;margin:12px 0}
.milestone-table th,.milestone-table td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:.9rem}

.pub-hero{background:linear-gradient(135deg,#0F5540 0%,#176B50 100%);color:#fff;border-radius:20px;padding:44px 32px;margin-bottom:32px;box-shadow:0 12px 30px rgba(15,85,64,0.18)}
.pub-hero h1{color:#fff;font-size:2.2rem;margin-bottom:10px}
.pub-hero p{color:#E5EDE2;font-size:1.1rem;max-width:760px}
.pub-logo{width:84px;height:84px;border-radius:18px;background:#fff;border:3px solid var(--lime);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:800;font-size:2rem;color:var(--emerald);margin-bottom:18px;overflow:hidden}
.pub-logo img{width:100%;height:100%;object-fit:cover}

.service-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin:20px 0}
.service-item{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;justify-content:space-between}
.service-price{font-size:1.25rem;font-weight:800;color:var(--emerald);margin-top:12px}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin:20px 0}
.team-card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center;display:flex;flex-direction:column;align-items:center}
.portfolio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;margin:20px 0}
.portfolio-card{background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.portfolio-img{width:100%;height:190px;background:var(--sage);object-fit:cover;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted)}
.step-prog{display:flex;gap:8px;margin:16px 0}
.step-dot{flex:1;height:6px;border-radius:999px;background:var(--line)}
.step-dot.done{background:var(--emerald)}
.agreement-box{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:20px}
.agreement-item{margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.agreement-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.disclaimer-alert{background:#FFFDE7;border:1px solid #FFF59D;color:#795548;padding:16px;border-radius:12px;margin:18px 0;font-size:.92rem}

/* ===================== Sections 10 & 11: Payments & Opportunities ===================== */
.pay-badge{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:999px;letter-spacing:.02em;text-transform:uppercase}
.pay-badge.Paid{background:#E8F5E9;color:#1B5E20;border:1px solid #A5D6A7}
.pay-badge.AwaitingPayment{background:#FFF9C4;color:#E65100;border:1px solid #FFE082}
.pay-badge.Processing{background:#E1F5FE;color:#0277BD;border:1px solid #81D4FA}
.pay-badge.Failed{background:#FFEBEE;color:#C62828;border:1px solid #EF9A9A}
.pay-badge.Refunded{background:#EDE7F6;color:#4527A0;border:1px solid #B39DDB}
.pay-badge.Disputed{background:#FBE9E7;color:#D84315;border:1px solid #FFAB91}

.finance-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:20px 0}
.stat-box{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:20px;position:relative}
.stat-box .num{font-size:1.85rem;font-family:var(--head);font-weight:800;color:var(--forest);margin:6px 0 2px}
.stat-box .sub{font-size:.82rem;color:var(--muted)}
.stat-box.highlight{border-color:var(--emerald);background:rgba(23,107,80,0.02)}

.alloc-card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px}
.alloc-progress{background:rgba(23,107,80,0.12);height:10px;border-radius:999px;overflow:hidden;margin:12px 0;display:flex}
.alloc-progress-seg{height:100%;transition:width .3s}

.opp-filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0;align-items:center}
.opp-chip{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--white);font-size:.86rem;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s}
.opp-chip:hover{border-color:var(--emerald);color:var(--forest)}
.opp-chip.active{background:var(--emerald);color:#fff;border-color:var(--emerald)}

.opp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:20px;margin:20px 0}
.opp-card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s,box-shadow .15s;position:relative}
.opp-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(24,68,55,0.08);border-color:var(--forest)}
.opp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.opp-org-badge{width:46px;height:46px;border-radius:12px;background:var(--sage);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--emerald);font-size:1.2rem;flex-shrink:0}

.badge.verified{background:#E8F5E9;color:#1B5E20;border:1px solid #81C784}
.badge.community{background:#FFF8E1;color:#F57F17;border:1px solid #FFE082}

.paystack-modal{border:2px solid #09A5DB;border-radius:16px;background:var(--white);padding:28px}
.paystack-banner{background:linear-gradient(135deg,#011B33 0%,#09A5DB 100%);color:#fff;border-radius:12px;padding:18px 20px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}

/* ===================== Talent Hub & Student Showcase ===================== */
.talent-hero{background:linear-gradient(145deg, #0F5540 0%, #176B50 70%, #1f7d5f 100%);color:#fff;border-radius:22px;padding:48px 36px;margin-bottom:32px;position:relative;overflow:hidden;box-shadow:0 16px 36px rgba(15,85,64,0.18)}
.talent-hero::after{content:'';position:absolute;right:-40px;top:-40px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle, rgba(197,232,108,0.18) 0%, transparent 70%);pointer-events:none}
.talent-hero h1{color:#fff;font-size:2.4rem;font-weight:800;letter-spacing:-0.03em;margin-bottom:12px;max-width:700px}
.talent-hero p{color:#E5EDE2;font-size:1.08rem;line-height:1.6;max-width:680px;margin-bottom:24px}
.talent-hero-acts{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.talent-hero .btn-lime{background:var(--lime);color:var(--forest);font-weight:700;border:none;padding:12px 22px;border-radius:10px;text-decoration:none;display:inline-flex;align-items:center;gap:8px;font-family:var(--head);transition:all .15s}
.talent-hero .btn-lime:hover{background:#b5de54;transform:translateY(-1px)}
.talent-hero .btn-ghost-light{border:1px solid rgba(229,237,226,0.5);color:#fff;font-weight:600;padding:12px 20px;border-radius:10px;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:all .15s}
.talent-hero .btn-ghost-light:hover{background:rgba(255,255,255,0.12)}

.talent-cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:20px;scrollbar-width:thin}
.talent-cat-btn{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--white);font-size:.85rem;font-weight:600;color:var(--forest);cursor:pointer;white-space:nowrap;transition:all .15s}
.talent-cat-btn:hover{border-color:var(--emerald);background:var(--ivory)}
.talent-cat-btn.active{background:var(--emerald);color:#fff;border-color:var(--emerald);box-shadow:0 2px 8px rgba(23,107,80,0.2)}

.talent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;margin-top:20px}
.talent-card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 2px 8px rgba(24,68,55,0.03);transition:transform .18s,box-shadow .18s,border-color .18s;position:relative}
.talent-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(24,68,55,0.08);border-color:#BDD4C7}
.talent-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.talent-avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--lime);background:var(--sage);flex-shrink:0}
.talent-meta-unboxed{font-size:.84rem;color:var(--muted);margin-top:2px;line-height:1.4}
.talent-headline{font-size:.95rem;font-weight:700;color:var(--forest);margin:8px 0 10px;line-height:1.4}
.talent-skills{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.talent-skill-tag{font-size:.76rem;background:var(--sage);color:var(--forest);padding:3px 9px;border-radius:6px;font-weight:600}
.talent-card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}

.talent-prof-header{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:36px;margin-bottom:28px;box-shadow:0 4px 16px rgba(24,68,55,0.04);position:relative}
.talent-prof-top{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.talent-prof-avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid var(--lime);box-shadow:0 6px 18px rgba(23,107,80,0.15);flex-shrink:0}
.talent-prof-actions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}

.talent-sec{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:28px;margin-bottom:24px}
.talent-sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:12px}
.talent-sec-h h2{font-size:1.35rem;font-weight:800;color:var(--forest);margin:0}

.talent-skill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.talent-skill-card{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--ivory);transition:border-color .15s}
.talent-skill-card:hover{border-color:var(--emerald)}
.skill-bar-wrap{height:6px;background:rgba(23,107,80,0.12);border-radius:999px;margin:8px 0;overflow:hidden}
.skill-bar-fill{height:100%;border-radius:999px;background:var(--emerald)}

.talent-portfolio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.talent-portfolio-item{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--white);display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(0,0,0,0.02);transition:transform .18s,box-shadow .18s}
.talent-portfolio-item:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(24,68,55,0.08)}
.portfolio-img-box{width:100%;height:190px;background:var(--sage);object-fit:cover;display:flex;align-items:center;justify-content:center;position:relative}
.portfolio-img-box img{width:100%;height:100%;object-fit:cover}

.looking-tag{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;border:1px solid #BDD4C7;background:var(--sage);color:var(--forest);font-size:.86rem;font-weight:600;margin:4px}
.disclaimer-banner{background:#FFFBEB;border:1px solid #FDE68A;border-radius:12px;padding:14px 18px;color:#92400E;font-size:.88rem;margin:16px 0;display:flex;gap:12px;align-items:flex-start;line-height:1.5}

/* ===================== Onboarding & Dashboard Enhancements ===================== */
.onboarding-wrap{max-width:760px;margin:36px auto;padding:32px 28px;background:var(--white);border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 30px rgba(24,68,55,0.06)}
.onboarding-stepper{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;position:relative}
.onboarding-stepper::before{content:'';position:absolute;top:18px;left:24px;right:24px;height:3px;background:var(--line);z-index:0}
.ob-step-node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.ob-step-circle{width:36px;height:36px;border-radius:50%;background:var(--white);border:2px solid var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;transition:all .2s}
.ob-step-node.active .ob-step-circle{border-color:var(--emerald);background:var(--emerald);color:#fff;box-shadow:0 0 0 4px rgba(23,107,80,0.18)}
.ob-step-node.completed .ob-step-circle{border-color:var(--lime);background:var(--lime);color:var(--forest)}
.ob-step-label{font-size:.75rem;font-weight:700;color:var(--muted);white-space:nowrap}
.ob-step-node.active .ob-step-label{color:var(--emerald);font-weight:800}

.rec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin:16px 0}
.rec-card{background:var(--ivory);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;transition:border-color .15s}
.rec-card:hover{border-color:var(--emerald)}

.member-talent-card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:14px;align-items:flex-start}
.tab-strip{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab-btn{background:none;border:none;padding:10px 16px;font-family:var(--head);font-size:.9rem;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab-btn:hover{color:var(--forest)}
.tab-btn.active{color:var(--emerald);border-bottom-color:var(--emerald);font-weight:800}
</style>
</head>

async function hashPw(pw, salt) {
  if (!(window.crypto && crypto.subtle)) {
    return "plain:" + pw.length + ":" + btoa(unescape(encodeURIComponent(pw + salt)));

  const k = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);

  return b64(bits);
}

  }
  if (!u.category) {
    u.category = (u.collab && u.collab[0]) || "Technology and Software Development";
  }
  if (!u.lookingFor || !u.lookingFor.length) {
    u.lookingFor = ["teammates", "join_agency"];
  }
  if (!u.socialLinks) {
    u.socialLinks = {};
  }
  if (!u.aboutMe) {
    u.aboutMe = u.bio || "";
  }
  if (!u.portfolio) {
    u.portfolio = [];
  }
  u.portfolio = u.portfolio.map(p => {
    if (typeof p === "string") return { id: rid(), title: "Portfolio Project", url: p, description: "", category: "General", tools: [] };
    if (p && !p.title && p.label) {
      return {
        id: p.id || rid(),
        title: p.label,
        url: p.url || "",
        description: p.desc || "Student showcase item.",
        category: "Portfolio",
        tools: [],
        image: p.image || ""
      };
    }
    return p;
  });
  if (!u.profileVisibility) {
    u.profileVisibility = "public";
  }
  u.deactivated = !!u.deactivated;
  u.suspended = !!u.suspended;
  if (!u.studentVerificationStatus) {
    u.studentVerificationStatus = "none";
  }
  return u;
}

function studentVerificationBadge(s) {
  if (!s) return "";
  if (s.suspended) return `<span class="badge needs-members">Suspended</span>`;
  if (s.studentVerificationStatus === "verified") {
    return `<span class="badge verified" title="Student status verified by TeamBud. Verification confirms student identity only and does not certify professional competence.">✓ Student Verified</span>`;
  }
  if (s.studentVerificationStatus === "pending") {
    return `<span class="badge forming" title="Student verification request is currently under review.">◐ Verification Pending</span>`;
  }
  if (s.verified) {
    return `<span class="badge role" title="Email verified account. Not yet student-ID verified.">✓ Email Verified</span>`;
  }
  return `<span class="badge role">Registered</span>`;
}

function agencyVerificationBadge(a) {
  if (!a) return "";
  if (a.suspended) return `<span class="badge needs-members">Suspended Agency</span>`;
  if (a.status === "forming") return `<span class="badge forming">Forming Agency (${(a.members || []).length}/3)</span>`;
  if (a.status === "needs_members") return `<span class="badge needs-members">Needs Members</span>`;
  if (a.verifiedStatus === "verified") {
    return `<span class="badge verified" title="Agency identity reviewed by TeamBud. Verification confirms operational standing only and does not certify commercial competence.">✓ Agency Verified</span>`;
  }
  if (a.verifiedStatus === "pending") {
    return `<span class="badge active" title="Active agency with verification under review.">Active · Verification Pending</span>`;
  }
  return `<span class="badge active" title="Active agency meeting the 3–10 member minimum. Not yet administrator-verified.">Active Agency (Unverified)</span>`;
}

function toPublicStudentProfile(s) {
  if (!s) return null;
  ensureStudentDefaults(s);
  return {
    id: s.id,
    role: s.role,
    demo: !!s.demo,
    verified: !!s.verified,
    studentVerificationStatus: s.studentVerificationStatus || "none",
    suspended: !!s.suspended,
    name: s.name,
    username: s.username,
    institution: s.institution,
    department: s.department,
    level: s.level,
    showLevel: s.showLevel !== false,
    country: s.country,
    state: s.state,
    headline: s.headline,
    bio: s.bio,
    aboutMe: s.aboutMe,
    experienceLevel: s.experienceLevel,
    category: s.category,
    photo: s.photo || "",
    skills: (s.skills || []).slice(),
    experience: (s.experience || []).slice(),
    portfolio: (s.portfolio || []).slice(),
    certs: (s.certs || []).slice(),
    lookingFor: (s.lookingFor || []).slice(),
    availability: s.availability || "unset",
    collab: (s.collab || []).slice(),
    socialLinks: Object.assign({}, s.socialLinks || {}),
    profileVisibility: s.profileVisibility || "public",
    created: s.created,
    updated: s.updated
  };
}

const students = (viewer = null) => db.users
  .filter(u => {
    if (u.role !== "student" || !u.verified || u.deactivated || u.suspended) return false;
    const vis = u.profileVisibility || "public";
    if (vis === "hidden") return false;
    if (vis === "students_only" && (!viewer || viewer.role !== "student")) return false;
    if (viewer && ((viewer.blockedUsers || []).includes(u.id) || (u.blockedUsers || []).includes(viewer.id))) return false;
    return true;
  })
  .map(ensureStudentDefaults);

function log(u, text) {
  u.activity = u.activity || [];
  u.activity.unshift({ t: now(), text });
  u.activity = u.activity.slice(0, 30);
}

function notify(uid, type, text) {
  const u = userById(uid);
  if (!u) return;
  const p = (u.prefs && u.prefs.inapp) || {};
  if (p[type] === false) return;
  db.notifs.unshift({ id: rid(), uid, type, text, t: now(), read: false });
}

function connBetween(a, b) {
  return db.conns.find(c => (c.from === a && c.to === b) || (c.from === b && c.to === a));
}

function connState(meId, otherId) {
  const c = connBetween(meId, otherId);
  if (!c) return "none";
  if (c.status === "accepted") return "connected";
  return c.from === meId ? "sent" : "incoming";
}

/* ===================== Agency & Team Status Logic ===================== */
/*
  PLATFORM RULES:
  - MINIMUM MEMBERS: 3
  - MAXIMUM MEMBERS: 10
  - FORMING: 1 or 2 members (Not publicly listed). Clearly shows how many needed.
  - ACTIVE: 3 to 10 members (Eligible for public listing).
  - NEEDS_MEMBERS: Was active, but member left/removed dropping below 3. Explains to owner.
*/
function syncAgencyStatus(agency) {
  if (!agency) return "forming";
  const count = (agency.members || []).length;
  const prev = agency.status;
  if (count < 3) {
    if (prev === "active") {
      agency.status = "needs_members";
      notify(agency.ownerId, "team_update", `Your agency "${agency.name}" has fallen below the 3-member minimum. Its status has changed to NEEDS MEMBERS and it is temporarily unlisted from public search.`);
    } else if (agency.status !== "needs_members") {
      agency.status = "forming";
    }
  } else if (count >= 3 && count <= 10) {
    if (agency.status === "forming" || agency.status === "needs_members") {
      agency.status = "active";
      notify(agency.ownerId, "team_update", `Great news! "${agency.name}" has reached ${count} members and is now active and publicly listed!`);
    }
  }
  agency.updatedAt = now();
  save();
  return agency.status;
}

function agencyById(id) {
  return (db.agencies || []).find(a => a.id === id);
}

function agencyBySlug(slug) {
  return (db.agencies || []).find(a => (a.slug || "").toLowerCase() === (slug || "").toLowerCase());
}

function userAgencies(userId) {
  return (db.agencies || []).filter(a => (a.members || []).some(m => m.userId === userId));
}

function userPendingInvites(userId, email) {
  const list = [];
  (db.agencies || []).forEach(a => {
    (a.invitations || []).forEach(inv => {
      if (inv.status === "pending" && (inv.inviteeUserId === userId || (email && inv.inviteeEmail && inv.inviteeEmail.toLowerCase() === email.toLowerCase()))) {
        list.push({ agency: a, invite: inv });
      }
    });
  });
  return list;
}

function isAgencyOwnerOrManager(agency, userId) {
  if (!agency || !userId) return false;
  if (agency.ownerId === userId) return true;
  const m = (agency.members || []).find(x => x.userId === userId);
  return m && (m.role === "Team Owner" || m.role === "Agency Manager");
}

function isAgencyMember(agency, userId) {
  if (!agency || !userId) return false;
  return (agency.members || []).some(x => x.userId === userId);
}

/* ===================== Core API Layer ===================== */
const API = {
  makeToken(uid, kind, ttl) {
    const t = rid() + rid();
    db.tokens = db.tokens.filter(x => x.uid !== uid || x.k !== kind);
    db.tokens.push({ t, uid, k: kind, exp: now() + ttl });
    return t;
  },

  useToken(token, kind) {
    const k = db.tokens.find(x => x.t === token && x.k === kind && x.exp > now());
    return k || null;
  },

  async registerStudent(f) {
    const email = f.email.trim().toLowerCase(), username = f.username.trim().toLowerCase(), errs = {};
    if (db.users.some(u => u.email === email)) errs.email = "An account with this email already exists. Try logging in.";
    if (db.users.some(u => u.username === username)) errs.username = "This username is taken. Try another.";
    if (Object.keys(errs).length) return { errs };
    const salt = rid(), u = {
      id: rid(),
      role: "student",
      name: f.name.trim(),
      email,
      salt,
      passHash: await hashPw(f.password, salt),
      verified: false,
      username,
      institution: f.institution.trim(),
      department: f.department.trim(),
      level: f.level,
      country: f.country,
      state: f.state.trim(),
      intents: f.intents,
      bio: "",
      photo: "",
      skills: [],
      experience: [],
      portfolio: [],
      certs: [],
      interests: [],
      availability: "unset",
      collab: [],
      prefs: { inapp: {}, email: {} },
      activity: [],
      onboarded: false,
      hasSeenOnboarding: false,
      profileVisibility: "public",
      deactivated: false,
      savedOpps: [],
      blockedUsers: [],
      created: now()
    };
    log(u, "Created your TeamBud account");
    db.users.push(u);
    const t = this.makeToken(u.id, "verify", 86400000);
    save();
    return { user: u, token: t };
  },

  async registerClient(f) {
    const email = f.email.trim().toLowerCase();
    if (db.users.some(u => u.email === email)) return { errs: { email: "An account with this email already exists. Try logging in." } };
    const salt = rid(), u = {
      id: rid(),
      role: "client",
      name: f.name.trim(),
      email,
      salt,
      passHash: await hashPw(f.password, salt),
      verified: false,
      accountType: f.accountType,
      country: f.country,
      contact: f.contact.trim(),
      prefs: { inapp: {}, email: {} },
      activity: [],
      created: now()
    };
    log(u, "Created your client account on TeamBud");
    db.users.push(u);
    const t = this.makeToken(u.id, "verify", 86400000);
    save();
    return { user: u, token: t };
  },

  async login(email, pw, remember) {
    email = email.trim().toLowerCase();
    const f = db.fails[email] || { n: 0, until: 0 };
    if (f.until > now()) return { err: "Too many attempts. Wait " + Math.ceil((f.until - now()) / 1000) + " seconds and try again." };
    const u = db.users.find(x => x.email === email);
    const ok = u && ((u.demo && u.passHash === "x" && (pw || "").length >= 8) || (await hashPw(pw, u.salt)) === u.passHash);
    if (!ok) {
      f.n++;
      if (f.n >= 5) { f.until = now() + 60000; f.n = 0; }
      db.fails[email] = f;
      save();
      return { err: "Email or password is incorrect." };
    }
    if (!u.verified) return { unverified: u };
    if (u.suspended) return { err: "This account has been suspended by an administrator. Contact support via the Contact page for review." };
    if (u.deactivated) {
      u.deactivated = false;
      log(u, "Reactivated TeamBud account");
      FLASH = { type: "ok", text: "Welcome back! Your account has been reactivated and restored." };
    }
    delete db.fails[email];
    db.session = { uid: u.id, exp: now() + (remember ? 86400000 * 14 : 3600000 * 8) };
    save();
    return { user: u };
  },

  logout() {
    db.session = null;
    save();
  },

  async resetPassword(token, pw) {
    const k = this.useToken(token, "reset");
    if (!k) return false;
    const u = userById(k.uid);
    u.salt = rid();
    u.passHash = await hashPw(pw, u.salt);
    db.tokens = db.tokens.filter(x => x.t !== token);
    delete db.fails[u.email];
    save();
    return true;
  },

  connect(meId, otherId, note = "") {
    if (!meId || !otherId || meId === otherId) return { err: "Invalid connection request." };
    if (connBetween(meId, otherId)) return { err: "A connection or pending request already exists." };
    const a = userById(meId), b = userById(otherId);
    if (!a || !b || a.deactivated || b.deactivated) return { err: "Account unavailable." };
    if ((a.blockedUsers || []).includes(b.id) || (b.blockedUsers || []).includes(a.id)) {
      return { err: "Cannot connect due to block settings." };
    }
    db.conns.push({ id: rid(), from: meId, to: otherId, status: "pending", note: (note || "").trim().slice(0, 300), t: now() });
    const notePreview = note ? ` Note: "${note.slice(0, 60)}..."` : "";
    notify(otherId, "connection_request", a.name + " wants to connect with you." + notePreview);
    log(a, "Sent a connection request to " + b.name);
    save();
    return { ok: true };
  },

  respond(id, accept, actor = me()) {
    const c = db.conns.find(x => x.id === id);
    if (!c) return { err: "Connection request not found." };
    if (actor && c.to !== actor.id) return { err: "Only the recipient can respond to this request." };
    const a = userById(c.to), b = userById(c.from);
    if (accept) {
      c.status = "accepted";
      notify(c.from, "connection_accepted", a.name + " accepted your connection request.");
      log(a, "Connected with " + b.name);
      log(b, "Connected with " + a.name);
    } else {
      db.conns = db.conns.filter(x => x.id !== id);
    }
    save();
    return { ok: true };
  },

  cancel(id, actor = me()) {
    const c = db.conns.find(x => x.id === id);
    if (!c) return { err: "Request not found." };
    if (actor && c.from !== actor.id) return { err: "Only the sender can cancel this request." };
    db.conns = db.conns.filter(x => x.id !== id);
    save();
    return { ok: true };
  },

  removeConnection(id, actor = me()) {
    const c = db.conns.find(x => x.id === id);
    if (!c) return { err: "Connection not found." };
    if (actor && c.from !== actor.id && c.to !== actor.id) return { err: "Not authorized to remove this connection." };
    db.conns = db.conns.filter(x => x.id !== id);
    save();
    return { ok: true };
  },

  sendDirectMessage(fromId, toId, text) {
    const fromUser = userById(fromId), toUser = userById(toId);
    const clean = (text || "").trim();
    if (!fromUser || !toUser || !clean) return { err: "Message text cannot be empty." };
    if (fromId === toId) return { err: "Cannot message yourself." };
    if ((fromUser.blockedUsers || []).includes(toId) || (toUser.blockedUsers || []).includes(fromId)) {
      return { err: "Messaging unavailable due to block settings." };
    }
    const isConnected = (db.conns || []).some(c => c.status === "accepted" && ((c.from === fromId && c.to === toId) || (c.from === toId && c.to === fromId)));
    const sharesAgency = userAgencies(fromId).some(a => isAgencyMember(a, toId));
    if (!isConnected && !sharesAgency) {
      return { err: "You can only message accepted connections or teammates in your agencies." };
    }
    db.messages = db.messages || [];
    const msg = { id: rid(), from: fromId, to: toId, text: clean.slice(0, 2000), read: false, t: now() };
    db.messages.push(msg);
    notify(toId, "message", `${fromUser.name} sent you a direct message.`);
    save();
    return { ok: true, msg };
  },

  addSkill(userId, skillData, actor = me()) {
    if (!actor || actor.id !== userId) return { err: "You can only modify your own skills." };
    const u = userById(userId);
    if (!u) return { err: "Student account not found." };
    const name = (skillData.name || "").trim();
    if (!name) return { err: "Enter a skill name." };
    if ((u.skills || []).some(s => s.name.toLowerCase() === name.toLowerCase())) {
      return { err: "You already added this skill." };
    }
    const sk = {
      id: rid(),
      name,
      level: skillData.level || "Intermediate",
      pro: skillData.pro !== false,
      learn: !!skillData.learn,
      collab: skillData.collab !== false
    };
    u.skills = u.skills || [];
    u.skills.push(sk);
    u.updated = now();
    log(u, "Added skill: " + name);
    save();
    return { ok: true, skill: sk };
  },

  removeSkill(userId, skillId, actor = me()) {
    if (!actor || actor.id !== userId) return { err: "You can only remove your own skills." };
    const u = userById(userId);
    if (!u) return { err: "Student account not found." };
    u.skills = (u.skills || []).filter(s => s.id !== skillId);
    u.updated = now();
    save();
    return { ok: true };
  },

  addPortfolioProject(userId, projData, actor = me()) {
    if (!actor || actor.id !== userId) return { err: "You can only add portfolio projects to your own profile." };
    const u = userById(userId);
    if (!u) return { err: "Student account not found." };
    const title = (projData.title || "").trim();
    const description = (projData.description || "").trim();
    if (!title || !description) return { err: "Project title and description are required." };
    const tools = Array.isArray(projData.tools)
      ? projData.tools
      : (projData.tools || "").split(",").map(t => t.trim()).filter(Boolean);
    const proj = {
      id: rid(),
      title,
      category: projData.category || "Project",
      date: (projData.date || "").trim() || new Date().getFullYear().toString(),
      description,
      tools,
      url: safeUrl(projData.url || ""),
      contribution: (projData.contribution || "").trim(),
      image: safeImg(projData.image || "")
    };
    u.portfolio = u.portfolio || [];
    u.portfolio.unshift(proj);
    u.updated = now();
    log(u, "Added portfolio project: " + title);
    save();
    return { ok: true, project: proj };
  },

  removePortfolioProject(userId, projId, actor = me()) {
    if (!actor || actor.id !== userId) return { err: "You can only remove your own portfolio projects." };
    const u = userById(userId);
    if (!u) return { err: "Student account not found." };
    u.portfolio = (u.portfolio || []).filter(p => p.id !== projId);
    u.updated = now();
    save();
    return { ok: true };
  },

  updateProfileVisibility(userId, visibility, actor = me()) {
    if (!actor || actor.id !== userId) return { err: "You can only update your own privacy settings." };
    if (!["public", "students_only", "hidden"].includes(visibility)) return { err: "Invalid visibility mode." };
    const u = userById(userId);
    if (!u) return { err: "Account not found." };
    u.profileVisibility = visibility;
    u.updated = now();
    log(u, "Updated profile visibility to " + visibility);
    save();
    return { ok: true };
  },

  deactivateAccount(userId, actor = me()) {
    if (!actor || actor.id !== userId) return { err: "Not authorized." };
    const u = userById(userId);
    if (!u) return { err: "Account not found." };
    u.deactivated = true;
    u.updated = now();
    log(u, "Deactivated TeamBud account");
    db.session = null;
    save();
    return { ok: true };
  },

  deleteAccount(userId, actor = me()) {
    if (!actor || actor.id !== userId) return { err: "Not authorized." };
    db.conns = (db.conns || []).filter(c => c.from !== userId && c.to !== userId);
    db.messages = (db.messages || []).filter(m => m.from !== userId && m.to !== userId);
    db.notifs = (db.notifs || []).filter(n => n.uid !== userId);
    (db.agencies || []).forEach(a => {
      const wasMember = (a.members || []).some(m => m.userId === userId);
      a.members = (a.members || []).filter(m => m.userId !== userId);
      a.invitations = (a.invitations || []).filter(inv => inv.inviteeUserId !== userId);
      if (a.ownerId === userId && a.members.length > 0) {
        a.ownerId = a.members[0].userId;
        a.members[0].role = "Team Owner";
      }
      if (wasMember) syncAgencyStatus(a);
    });
    db.users = (db.users || []).filter(u => u.id !== userId);
    db.session = null;
    save();
    return { ok: true };
  },

  blockAndReport(reporterId, reportedId, reason, comments) {
    if (!db.reports) db.reports = [];
    db.reports.push({
      id: rid(),
      reporterId,
      reportedId,
      reason: reason || "Unspecified",
      comments: (comments || "").trim(),
      t: now()
    });
    const u = userById(reporterId);
    if (u) {
      if (!u.blockedUsers) u.blockedUsers = [];
      if (!u.blockedUsers.includes(reportedId)) u.blockedUsers.push(reportedId);
    }
    // Remove any connection
    db.conns = db.conns.filter(c => !( (c.from === reporterId && c.to === reportedId) || (c.from === reportedId && c.to === reporterId) ));
    save();
  },

  unblockUser(userId, targetId) {
    const u = userById(userId);
    if (u && u.blockedUsers) {
      u.blockedUsers = u.blockedUsers.filter(x => x !== targetId);
      save();
    }
  },

        }

      createdAt: now(),
      updatedAt: now()
    };

    db.agencies.push(agency);
    log(creator, `Established new agency brand: "${name}"`);
    notify(creator.id, "team_update", `Your agency "${name}" was created in FORMING status. Invite at least 2 more students to reach the 3-member minimum.`);
    save();
    return { agency };
  },

  inviteToAgency(agencyId, studentId, role, customRoleDesc, actor) {
    const a = agencyById(agencyId);
    if (!a) return { err: "Agency not found." };
    if (!isAgencyOwnerOrManager(a, actor.id)) return { err: "Only Team Owners or Agency Managers can send invitations." };

    // Strict Rule: Max 10 members!
    if ((a.members || []).length >= 10) {
      return { err: "Agency has reached the strict maximum limit of 10 active members." };
    }

    const student = userById(studentId);
    if (!student) return { err: "Student not found." };

    if ((a.members || []).some(m => m.userId === studentId)) {
      return { err: `${student.name} is already an active member of this agency.` };
    }

    if ((a.invitations || []).some(inv => inv.inviteeUserId === studentId && inv.status === "pending")) {
      return { err: `An invitation is already pending for ${student.name}.` };
    }

    const inv = {
      id: rid(),
      agencyId,
      inviteeUserId: studentId,
      inviteeName: student.name,
      inviteeEmail: student.email,
      role: role || "Team Member",
      customRoleDesc: (customRoleDesc || "").trim(),
      code: "inv_" + rid().slice(0, 8),
      status: "pending",
      createdAt: now()
    };

    a.invitations.unshift(inv);
    notify(studentId, "agency_invitation", `${actor.name} invited you to join "${a.name}" as ${inv.role}.`);
    log(actor, `Invited ${student.name} to join "${a.name}"`);
    save();
    return { ok: true, inv };
  },

  createShareableInvite(agencyId, role, customRoleDesc, actor) {
    const a = agencyById(agencyId);
    if (!a) return { err: "Agency not found." };
    if (!isAgencyOwnerOrManager(a, actor.id)) return { err: "Only Team Owners or Agency Managers can create invite links." };
    if ((a.members || []).length >= 10) return { err: "Agency has reached the 10 member maximum." };

    const inv = {
      id: rid(),
      agencyId,
      role: role || "Team Member",
      customRoleDesc: (customRoleDesc || "").trim(),
      code: "inv_" + rid().slice(0, 8),
      status: "pending",
      createdAt: now()
    };
    a.invitations.unshift(inv);
    save();
    return { ok: true, code: inv.code };
  },

  cancelAgencyInvite(agencyId, inviteId, actor) {
    const a = agencyById(agencyId);
    if (!a) return false;
    if (!isAgencyOwnerOrManager(a, actor.id)) return false;
    a.invitations = a.invitations.filter(i => i.id !== inviteId);
    save();
    return true;
  },

  respondAgencyInvite(agencyId, inviteId, accept, student) {
    const a = agencyById(agencyId);
    if (!a) return { err: "Agency not found." };
    const inv = (a.invitations || []).find(i => i.id === inviteId || i.code === inviteId);
    if (!inv || inv.status !== "pending") return { err: "This invitation is no longer valid or has already been used." };

    if (!accept) {
      inv.status = "declined";
      notify(a.ownerId, "team_update", `${student.name} declined the invitation to join "${a.name}".`);
      save();
      return { ok: true, status: "declined" };
    }

    // Strict Rule: Enforce 10-member maximum!
    if ((a.members || []).length >= 10) {
      return { err: "This agency has already reached the maximum limit of 10 active members." };
    }

    if ((a.members || []).some(m => m.userId === student.id)) {
      inv.status = "accepted";
      save();
      return { err: "You are already an active member of this agency." };
    }

    inv.status = "accepted";
    a.members.push({
      userId: student.id,
      role: inv.role || "Team Member",
      customRoleDesc: inv.customRoleDesc || "",
      joinedAt: now(),
      status: "accepted"
    });

    log(student, `Joined "${a.name}" as ${inv.role}`);
    notify(a.ownerId, "team_update", `${student.name} accepted your invitation and joined "${a.name}"!`);
    syncAgencyStatus(a);
    save();
    return { ok: true, agency: a };
  },

  removeAgencyMember(agencyId, memberUserId, actor) {
    const a = agencyById(agencyId);
    if (!a) return { err: "Agency not found." };
    if (!isAgencyOwnerOrManager(a, actor.id)) return { err: "Unauthorized." };
    if (memberUserId === a.ownerId) return { err: "Cannot remove the Team Owner. Reassign ownership first." };

    const member = userById(memberUserId);
    a.members = a.members.filter(m => m.userId !== memberUserId);
    if (member) {
      notify(memberUserId, "team_update", `Your membership in "${a.name}" was concluded.`);
      log(member, `Left agency "${a.name}"`);
    }

    // Automatically check if membership fell below 3 members!
    syncAgencyStatus(a);
    save();
    return { ok: true };
  },

  updateAgencyRole(agencyId, memberUserId, role, customRoleDesc, actor) {
    const a = agencyById(agencyId);
    if (!a) return { err: "Agency not found." };
    if (!isAgencyOwnerOrManager(a, actor.id)) return { err: "Unauthorized." };

    const m = a.members.find(x => x.userId === memberUserId);
    if (!m) return { err: "Member not found." };

    m.role = role;
    if (customRoleDesc != null) m.customRoleDesc = customRoleDesc.trim();
    if (role === "Team Owner" && actor.id === a.ownerId) {
      // Ownership transfer
      a.ownerId = memberUserId;
    }
    save();
    return { ok: true };
  },

  acknowledgeAgreement(agencyId, userId) {

    if (!a) return false;
    a.agreement = a.agreement || { acknowledged: [] };
    if (!a.agreement.acknowledged.includes(userId)) {
      a.agreement.acknowledged.push(userId);
      save();
    }
    return true;
  },
